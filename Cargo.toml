[package]
name = "infscaler"
version = "0.1.0"
edition = "2021"
description = "Local photo enhancement and upscaling for Linux"
license = "MIT"
rust-version = "1.85"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
